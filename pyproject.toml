[project]
name = "pata"
version = "0.1.0"
description = "Pata: an open-source benchmark (PataBench) and ML toolkit for Indian address intelligence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jenoy REX", email = "jenoyrex95@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1,<4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
