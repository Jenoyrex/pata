deps = []
gate = "none"
owner = "agent"
outputs = ["docs/research/source-inventory.md"]
acceptance = [
  "Every candidate lists publisher, exact file/snapshot, URL, retrieval date or 'not retrieved'",
  "No raw data committed to Git",
]

[[node]]
id = "E-FIELD"
title = "Field semantics evidence (incl. C1a Address_Original_First_Line)"
phase = "P1-evidence"
kind = "evidence"
status = "todo"
notes = "2026-11-04: evidence gathered in docs/research/source-inventory.md, eleventh pass. Started once E-INV is done."
deps = ["E-INV"]
gate = "none"
owner = "agent"
outputs = ["docs/research/source-inventory.md", "docs/research/focus-state-source-evaluation.md"]
acceptance = [
  "Each candidate raw-text field backed by publisher documentation, not column names",
  "C1a outcome stated: qualifies / does not qualify / undetermined, with evidence",
]

[[node]]
id = "E-LIC"
title = "Licence + redistribution evidence (B14–B17)"
