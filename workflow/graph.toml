acceptance = [
  "Each level has LGD-side evidence: URL, retrieval date, quoted field definition, file hash if downloaded",
  "Any level without evidence is explicitly marked UNVERIFIED (never guessed)",
  "CAPTCHA/403 blocks are logged, not bypassed; maintainer asked to fetch manually",
]
notes = "Runs in parallel with G-ADR67. Must finish or be frozen-as-unverified before D-GUIDE."

