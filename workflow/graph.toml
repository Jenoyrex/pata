kind = "evidence"
status = "todo"
deps = ["E-INV"]
gate = "none"
owner = "agent"
outputs = ["docs/research/source-inventory.md", "docs/research/focus-state-source-evaluation.md"]
acceptance = [
  "Per source: licence text location, redistribution terms, attribution terms, retrieval date",
  "Unknown stays UNKNOWN; no inferred permission",
]

[[node]]
id = "E-B6"
title = "Scripted aggregate inspection of candidate source files (B6)"
phase = "P1-evidence"
kind = "impl"
status = "done"
deps = []
gate = "none"
owner = "agent"
outputs = ["scripts/source_stats.py", "tests/test_source_stats.py"]
acceptance = [
  "Refuses a file whose SHA-256 differs from the recorded value",
  "Report has the header row and aggregate statistics only; a test asserts no cell value appears",
  "Invalid UTF-8, NUL bytes and ragged rows are reported, never repaired",
  "Two runs give byte-identical output",
]
verify = ["uv run pytest tests/test_source_stats.py -q"]
notes = "Tool only, tested on synthetic fixtures (ADR-0007 section 5 evidence limit). Running it on a real candidate needs a file the maintainer retrieves manually; B6 stays open until then."

[[node]]
id = "G-SRC"
title = "Maintainer accept/reject decision per source"
phase = "P1-evidence"
kind = "decision"
status = "todo"
deps = ["E-FIELD", "E-LIC"]
gate = "maintainer"
owner = "maintainer"
outputs = ["docs/research/focus-state-source-evaluation.md"]
acceptance = ["Each candidate has dated ACCEPT / REJECT / DEFER with reason, signed by maintainer"]

