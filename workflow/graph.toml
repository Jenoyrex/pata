# ============================================================================
# Pata — execution dependency graph (single source of truth for "what next")
# ============================================================================
# Validated by:   uv run python scripts/graph.py validate
# Ready tasks:    uv run python scripts/graph.py next
#
# RULES (enforced by scripts/graph.py and .claude/hooks):
#   * A node may start only when every dep is `done`.
#   * gate = "maintainer" nodes can only become `done` when a matching
#     [[approval]] entry exists. Approvals are added ONLY by the maintainer,
#     in their own terminal:  uv run python scripts/graph.py approve <ID> --by <name> --ref <evidence>
#     Claude is blocked from writing approvals (hook).
#   * irreversible = true nodes require an explicit maintainer go-ahead in chat
#     BEFORE Claude runs them, even if all deps are done.
#   * `status` values: todo | in_progress | review | blocked | done | dropped
#       review   = work finished, waiting for maintainer decision
#       blocked  = external blocker; `blocker` field required
#   * Statuses were seeded from the dossier of 28 Oct 2026 and reconciled with
#     docs/research/dependency-graph.md in W0 (2026-10-29). Legacy T0–T10 are
#     LEGACY, T11 is G-ADR67, T12 is dropped with its scope mapped (see notes).
# ============================================================================

schema_version = 1
project = "pata"

# ---------------------------------------------------------------- Phase 0
[[node]]
id = "LEGACY"
title = "T0–T10 design/planning tasks (imported)"
phase = "P0-governance"
kind = "decision"
status = "done"
deps = []
gate = "none"
owner = "agent"
outputs = ["docs/research/dependency-graph.md"]
acceptance = ["T0–T10 recorded verified in the legacy dependency graph"]
notes = "Imported as one node. Design verification ≠ implementation. Split into T0..T10 nodes if you want finer tracking. Legacy T11 maps to G-ADR67; legacy T12 is the dropped node T12, its scope mapped to implementation nodes."

[[node]]
id = "W0"
title = "Install workflow kit (graph, LOOP, hooks, commands, agents)"
phase = "P0-governance"
kind = "infra"
status = "review"
deps = []
gate = "maintainer"
owner = "agent"
outputs = ["workflow/graph.toml", "scripts/graph.py", ".claude/settings.json", "docs/workflow/LOOP.md"]
acceptance = [
  "graph.py validate passes",
  "tests/workflow pass alongside existing 26 tests",
  "hook smoke tests pass (tests/workflow/test_hooks.py)",
  "graph reconciled against docs/research/dependency-graph.md (no task lost or invented)",
]
verify = ["uv run python scripts/graph.py validate", "uv run pytest tests/workflow -q"]

[[node]]
id = "G-ADR67"
title = "T11 + D10.1: review and joint acceptance of ADR-0006 rev 6 and ADR-0007 rev 4"
phase = "P0-governance"
kind = "decision"
status = "review"
deps = ["LEGACY"]
gate = "maintainer"
owner = "maintainer"
outputs = [
  "docs/decisions/0006-annotation-scope-and-schema.md",
  "docs/decisions/0007-focus-states-and-sources.md",
]
acceptance = [
  "T11 incorporates every approved ruling (D10.1)",
  "Cross-reference checks pass (D10.1)",
  "Full diff main..adr-0006-rev6 reviewed",
  "Changed decision items re-approved by name (D10.1): ADR-0006 F1,F3,F5,F9,F10,F12,F14,F15; ADR-0007 S6,S9",
  "Deferred P/L/O/E items confirmed non-blocking and documented",
  "Dated maintainer acceptance written in BOTH ADRs by the maintainer",
  "Branch merged by the maintainer",
]
notes = "Maps legacy T11 (coordinated revision). The draft exists only on local branch adr-0006-rev6 (099fdb6, 0513447); on main and workflow-kit both ADRs are still rev 5 / rev 3. Use /gate-review G-ADR67. Claude prepares the review packet only."

[[node]]
id = "T12"
title = "T12 implementation task (scope per legacy dependency graph)"
phase = "P3-pipeline"
kind = "impl"
status = "dropped"
deps = ["G-ADR67"]
gate = "none"
owner = "agent"
outputs = []
acceptance = ["Dropped in W0 (2026-10-29): no obligation remains here; each is carried by a node in notes"]
notes = "Legacy T12 'Follow-up implementation (docs/schema.md, procedures, validator)', docs/research/dependency-graph.md T12 row. Scope mapped: docs/schema.md formats -> D-SCHEMA; Scripts.txt provenance -> U-UNICODE; ingestion and decoding -> I-INGEST; split key and T5 vectors -> I-SPLITKEY; screening and denylist -> I-RULESCREEN, H-SCREEN; tables -> I-TABLES; candidate and resolution procedures -> I-RESOLVE; validator -> I-VALIDATOR. Kept, not deleted (LOOP.md)."

# ---------------------------------------------------------------- Phase 1: evidence (parallel)
[[node]]
id = "E-LGD"
title = "LGD level verification: state / district / sub-district / village"
