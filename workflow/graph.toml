  "Defines the formats legacy T12 deferred to it: independent-C `independent_set` (D3.2), stage flag `level_mapping_unverified` (R1c), reasons `anchor_invalidated`, `district_column_ambiguous` and the T6 ingestion reasons, denylist and errata entry formats (D8.1, D8.3), the reason-category list, release-manifest fields (T9), and every ADR-0007 E3 format",
]

