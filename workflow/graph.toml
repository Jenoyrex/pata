]
acceptance = [
  "Version equals unicodedata.unidata_version of the pinned Python",
  "SHA-256 + source URL + retrieval date recorded; test asserts both",
  "Provenance manifest in data/manifests/ with every ADR-0001 §5 field: name and URL, publisher, licence (Unicode License v3) and licence-text link, retrieval date, SHA-256, whether redistribution is permitted, transformations applied (script path + git commit)",
  "Storage location and any redistribution decided by the maintainer before the file is placed; a redistributed copy carries the Unicode copyright and permission notice",
]
notes = "The kit's vendor/unicode/ path is not adopted: committing a data file conflicts with ADR-0001 §2 ('Data files are never committed to git'). Maintainer instruction 2026-11-04: keep the raw file at data/raw/unicode.org/Scripts.txt, so it is not redistributed from the repository. Evidence: docs/research/dependency-graph.md T9 rulings (D9.2)."

